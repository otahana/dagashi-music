<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dagashi × music — TACTILE 3D SOUND ARCHIVE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Silkscreen:wght@400;700&display=swap');

    :root {
      --bg: #0d0e11;
      --surface: rgba(24, 26, 30, 0.86);
      --border: rgba(255, 255, 255, 0.18);
      --text-main: #f8f8fa;
      --text-dim: #92969e;
      --nothing-red: #e01e26;
      --nothing-red-glow: rgba(224, 30, 38, 0.48);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'JetBrains Mono', 'Noto Sans JP', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }

    #webgl-container:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      inset: 0;
      width: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .rec-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--nothing-red);
      box-shadow: 0 0 10px var(--nothing-red);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Silkscreen', monospace;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text-main);
    }

    .brand-meta {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .archive-switcher {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(20, 22, 26, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      max-width: 100%;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.07);
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #2e313a 0%, #1c1e24 100%);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .tab-btn.active .tab-num {
      color: var(--nothing-red);
    }

    .top-actions {
      pointer-events: auto;
    }

    .tactile-pill {
      background: linear-gradient(180deg, #22242a 0%, #15161a 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 0 #050507, 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tactile-pill:active, .tactile-pill.is-active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #050507, 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .tactile-pill.is-active {
      border-color: var(--nothing-red);
    }

    .led-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
    }

    .tactile-pill.is-active .led-indicator {
      background: var(--nothing-red);
      box-shadow: 0 0 8px var(--nothing-red);
    }

    .detail-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    body.detail-open .detail-backdrop {
      pointer-events: auto;
      opacity: 1;
    }

    .detail-panel {
      position: fixed;
      right: 32px;
      top: 84px;
      width: 330px;
      max-height: calc(100dvh - 180px);
      overflow-y: auto;
      background: rgba(16, 18, 22, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px dashed rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      padding: 18px 20px;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(-8px);
      visibility: hidden;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.78);
      z-index: 30;
    }

    body.detail-open .detail-panel {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      color: var(--nothing-red);
      margin-bottom: 14px;
      letter-spacing: 0.06em;
    }

    .detail-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-family: 'Silkscreen', monospace;
      font-size: 10px;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .detail-close-btn:hover {
      background: var(--nothing-red);
      border-color: var(--nothing-red);
    }

    .detail-block {
      margin-bottom: 13px;
      padding-bottom: 13px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.14);
    }

    .detail-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .detail-k {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail-v {
      font-size: 12px;
      line-height: 1.6;
      color: #ececef;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .detail-disclaimer {
      font-size: 10px;
      line-height: 1.5;
      color: var(--text-dim);
      font-family: 'Noto Sans JP', sans-serif;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .spec-cell {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 8px;
    }

    .spec-cell-label {
      font-size: 9px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .spec-cell-val {
      font-size: 11px;
      color: #fff;
      font-weight: 600;
      margin-top: 2px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
      width: 100%;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 480px;
      width: 100%;
    }

    .telemetry {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.6;
      letter-spacing: 0.04em;
      word-break: break-word;
    }

    .telemetry span {
      color: var(--text-main);
    }

    .disclaimer-line {
      font-size: 10px;
      color: rgba(146, 150, 158, 0.72);
      font-family: 'Noto Sans JP', sans-serif;
      line-height: 1.45;
      letter-spacing: 0.02em;
      word-break: break-word;
    }

    .console-dock {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(20, 22, 26, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 14px 16px;
      border-radius: 20px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      max-width: 100%;
    }

    .console-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .console-label {
      font-family: 'Silkscreen', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin-right: 2px;
    }

    .mech-btn {
      position: relative;
      background: linear-gradient(180deg, #2a2d34 0%, #1a1c20 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 0 #09090b, 0 6px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.06s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.06s ease, background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .mech-btn:hover {
      background: linear-gradient(180deg, #343840 0%, #212328 100%);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .mech-btn:active, .mech-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b, 0 2px 4px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .mech-btn.red-key {
      background: linear-gradient(180deg, #eb252d 0%, #b81219 100%);
      border-color: #ff666d;
      box-shadow: 0 4px 0 #5e070b, 0 6px 16px var(--nothing-red-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .mech-btn.red-key:active, .mech-btn.red-key.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5e070b, 0 2px 8px var(--nothing-red-glow);
    }

    .note-keys {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .note-key {
      width: 38px;
      height: 42px;
      padding: 0;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .note-key .note-name { font-size: 11px; font-weight: 700; }
    .note-key .key-bind { font-size: 8px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

    .sequencer-row {
      border-top: 1px dashed rgba(255, 255, 255, 0.14);
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .seq-controls-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .seq-steps {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .step-pad {
      width: 30px;
      height: 28px;
      border-radius: 6px;
      background: #181a1e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 2px 0 #050507, inset 0 1px 0 rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.05s, background 0.12s, border-color 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--text-dim);
    }

    .step-pad:active { transform: translateY(2px); }
    .step-pad[data-mode="1"] { background: rgba(224, 30, 38, 0.3); border-color: var(--nothing-red); color: #fff; }
    .step-pad[data-mode="2"] { background: rgba(255, 255, 255, 0.22); border-color: #fff; color: #fff; }
    .step-pad[data-mode="3"] { background: rgba(255, 255, 255, 0.1); border-style: dashed; border-color: rgba(255, 255, 255, 0.55); color: #ddd; }
    .step-pad.current { outline: 2px solid var(--nothing-red); outline-offset: 1px; box-shadow: 0 0 12px var(--nothing-red-glow); }

    @media (max-width: 860px) {
      .hud { padding: 12px 12px 14px; }
      .brand-tag { font-size: 9px; letter-spacing: 0.12em; }
      .brand-title { font-size: 19px; }
      .brand-meta { font-size: 9px; }
      .archive-switcher { width: 100%; justify-content: space-between; padding: 4px; }
      .tab-btn { font-size: 9px; padding: 6px 6px; flex: 1; justify-content: center; gap: 4px; }
      .tactile-pill { font-size: 9px; padding: 6px 12px; }
      .detail-panel { left: 12px; right: 12px; width: auto; top: 16px; max-height: calc(100dvh - 32px); padding: 16px; }
      footer { flex-direction: column; align-items: stretch; gap: 8px; }
      .telemetry { font-size: 9px; line-height: 1.45; }
      .disclaimer-line { font-size: 8.5px; line-height: 1.35; }
      .console-dock { width: 100%; padding: 10px 10px; border-radius: 16px; gap: 8px; }
      .console-row { gap: 5px; }
      .console-label { font-size: 9px; }
      .mech-btn { font-size: 9px; padding: 7px 9px; border-radius: 8px; }
      .note-key { width: 32px; height: 36px; }
      .sequencer-row { padding-top: 8px; gap: 6px; }
      .seq-controls-head { width: 100%; justify-content: space-between; }
      .seq-steps { width: 100%; justify-content: space-between; }
      .step-pad { flex: 1; max-width: 34px; height: 26px; font-size: 8px; }
    }
  </style>

    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

      }
    }
  </script>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="webgl-container"></div>

  <div class="detail-backdrop" id="detailBackdrop"></div>
  <aside class="detail-panel" id="detailPanel"></aside>

  <div class="hud">
    <header>
      <div class="brand">
        <div class="brand-tag">
          <span class="rec-dot"></span>
          <span id="brandEyebrow">DAGASHI × MUSIC // ARCHIVE (01)</span>
        </div>
        <h1 class="brand-title" id="brandTitle">GO-GO RAMUNE</h1>
        <div class="brand-meta" id="brandMeta">WHISTLE-CAP CONFECTIONERY SYNTHESIZER</div>
      </div>

      <nav class="archive-switcher" aria-label="Dagashi Selector">
        <button class="tab-btn active" data-item="ramune">
          <span class="tab-num">01</span><span>RAMUNE</span>
        </button>
        <button class="tab-btn" data-item="sakuranbo">
          <span class="tab-num">02</span><span>SAKURANBO</span>
        </button>
        <button class="tab-btn" data-item="yattermen">
          <span class="tab-num">03</span><span>YATTER! MEN</span>
        </button>
      </nav>

      <div class="top-actions">
        <button id="detailBtn" class="tactile-pill">
          <span class="led-indicator"></span>
          <span>ITEM DETAILS</span>
        </button>
      </div>
    </header>

    <footer>
      <div class="footer-left">
        <div class="telemetry" id="telemetryText">
          [DRAG 3D] ORBIT &nbsp;/&nbsp; [CLICK CAP] SLIDE &nbsp;/&nbsp; [KEYS A–H] PLAY WHISTLE<br>
          STATUS: <span id="statusVal">CAP LOCKED</span> &nbsp;//&nbsp; SEQ: <span id="seqStatus">STOPPED</span>
        </div>
        <div class="disclaimer-line">
          ※本作品はポートフォリオ制作を目的とした非商用のファンアート（オマージュ作品）であり、実在のメーカー・企業様とは一切関係ありません。
        </div>
      </div>

      <div class="console-dock">
        <div class="console-row" id="dynamicControls"></div>
        <div class="sequencer-row">
          <div class="seq-controls-head">
            <div style="display:flex; align-items:center; gap:8px;">
              <button id="playSeqBtn" class="mech-btn red-key" style="padding: 7px 12px;">▶ LOOP</button>
              <span class="console-label" id="seqModeLabel">8-STEP BEAT</span>
            </div>
            <button id="clearSeqBtn" class="mech-btn" style="padding: 7px 10px; font-size:10px;">CLR</button>
          </div>
          <div class="seq-steps" id="seqSteps"></div>
        </div>
      </div>
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgW = 0, bgH = 0, bgDpr = 1;
    const bgEffects = [];

    function resizeBgCanvas() {
      bgDpr = Math.min(window.devicePixelRatio || 1, 2);
      bgW = window.innerWidth;
      bgH = window.innerHeight;
      bgCanvas.width = bgW * bgDpr;
      bgCanvas.height = bgH * bgDpr;
      bgCtx.setTransform(bgDpr, 0, 0, bgDpr, 0, 0);
    }
    resizeBgCanvas();
    window.addEventListener('resize', resizeBgCanvas);

    function triggerBgAction(type, opts = {}) {
      bgEffects.push({
        type,
        progress: 0,
        speed: opts.speed || 0.032,
        yRatio: opts.yRatio !== undefined ? opts.yRatio : 0.5,
        cx: opts.cx !== undefined ? opts.cx : bgW * 0.5,
        cy: opts.cy !== undefined ? opts.cy : bgH * 0.45,
        redAccent: Boolean(opts.redAccent),
        intensity: opts.intensity || 1.0
      });
    }

    function renderBgDots(time, sustainLevel) {
      bgCtx.fillStyle = '#0d0e11';
      bgCtx.fillRect(0, 0, bgW, bgH);

      const centerGrad = bgCtx.createRadialGradient(bgW * 0.5, bgH * 0.45, 0, bgW * 0.5, bgH * 0.45, Math.max(bgW, bgH) * 0.6);
      centerGrad.addColorStop(0, `rgba(255, 255, 255, ${0.045 + sustainLevel * 0.03})`);
      centerGrad.addColorStop(1, 'rgba(13, 14, 17, 0)');
      bgCtx.fillStyle = centerGrad;
      bgCtx.fillRect(0, 0, bgW, bgH);

      for (let i = bgEffects.length - 1; i >= 0; i--) {
        bgEffects[i].progress += bgEffects[i].speed;
        if (bgEffects[i].progress >= 1) bgEffects.splice(i, 1);
      }

      const spacing = 26;
      const cols = Math.ceil(bgW / spacing);
      const rows = Math.ceil(bgH / spacing);

      for (let r = 0; r <= rows; r++) {
        const y = r * spacing;
        const normY = y / bgH;
        for (let c = 0; c <= cols; c++) {
          const x = c * spacing;
          const normX = x / bgW;
          let alpha = 0.11, radius = 1.05, redMix = 0;

          if (sustainLevel > 0.01) {
            const waveVal = Math.sin(normX * 10 - time * 9 + normY * 3) * 0.5 + 0.5;
            alpha += waveVal * 0.22 * sustainLevel;
            radius += waveVal * 0.7 * sustainLevel;
            redMix += Math.max(0, waveVal - 0.65) * 1.4 * sustainLevel;
          }

          for (let i = 0; i < bgEffects.length; i++) {
            const ef = bgEffects[i];
            const p = ef.progress;
            const fade = Math.sin(p * Math.PI);

            if (ef.type === 'wave') {
              const frontX = -0.15 + p * 1.3;
              const distX = Math.abs(normX - frontX);
              const verticalCurve = Math.sin(normX * Math.PI * 3 - p * 8) * 0.08;
              const distY = Math.abs(normY - (ef.yRatio + verticalCurve));
              if (distX < 0.16) {
                const band = (1 - distX / 0.16) * (1 - p * 0.35);
                const pitchFocus = Math.max(0.25, 1 - distY * 1.8);
                const boost = band * pitchFocus * ef.intensity;
                alpha += boost * 0.55;
                radius += boost * 1.45;
                if (ef.redAccent || distX < 0.04) redMix += boost * 0.75;
              }
            } else if (ef.type === 'ripple') {
              const dist = Math.hypot(x - ef.cx, y - ef.cy);
              const ringR = p * Math.max(bgW, bgH) * 0.75;
              const diff = Math.abs(dist - ringR);
              if (diff < 75) {
                const ringBoost = (1 - diff / 75) * (1 - p) * ef.intensity;
                alpha += ringBoost * 0.6;
                radius += ringBoost * 1.6;
                if (ef.redAccent) redMix += ringBoost * 0.85;
              }
            } else if (ef.type === 'flash') {
              const sweep = Math.abs(normX - p);
              const checker = ((c + r) % 2 === 0) ? 1.0 : 0.45;
              const pulse = fade * checker * (sweep < 0.45 ? 1.2 : 0.5) * ef.intensity;
              alpha += pulse * 0.36;
              radius += pulse * 0.9;

    function triggerJellyPick(idx, screenPos = null) {
      const cell = jellyCells[idx];
      if (!cell) return;
      cell.lift = 0.24;
      state.tpTargetPos.set(cell.basePos.x, cell.basePos.y + 0.15, cell.basePos.z + 0.24);
      state.tpReturnTimer = 28;
      audio.playJellyNote(cell.freq);
      state.pulseBump = 0.025;
      const yRatio = Math.max(0.2, Math.min(0.8, 0.8 - (idx / 12) * 0.6));
      triggerBgAction('wave', { yRatio, speed: 0.038, redAccent: idx % 3 === 0, intensity: 0.95 });
      triggerBgAction('ripple', { cx: screenPos ? screenPos.x : bgW * 0.5, cy: screenPos ? screenPos.y : bgH * 0.45, speed: 0.032, redAccent: idx % 4 === 0, intensity: 0.85 });
      const st = document.getElementById('statusVal');
      if (st) st.textContent = `CELL #${String(idx + 1).padStart(2, '0')} (${Math.round(cell.freq)}Hz)`;
    }

      const pool = ['100円 当たり!', '50円 当たり!', '10円 当たり!', '10円 当たり!', 'はずれ...'];

      updateLotteryMesh(currentLotteryText);

    function toggleYatterLid() {
      state.yLidOpen = !state.yLidOpen;

      triggerBgAction('flash', { speed: 0.04, redAccent: state.yLidOpen, intensity: 1.0 });
      const st = document.getElementById('statusVal');
      if (state.yLidOpen) {
        if (currentLotteryText.includes('当たり')) setTimeout(() => audio.playWinChime(), 160);
        if (st) st.textContent = `LOTTERY: ${currentLotteryText}`;
      } else {
        if (st) st.textContent = 'LID SEALED';
      }
    }

    function applyResponsiveCamera(itemKey) {
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = window.innerWidth <= 860;
      // 縦長画面(aspect < 1)でも左右が画面端と被らないよう距離を自動補正
      const aspectMult = aspect < 1.0 ? Math.max(1.15, 0.96 / aspect) : 1.0;

      if (itemKey === 'sakuranbo') {
        camera.position.set(1.1 * aspectMult, 0.42 * aspectMult, 8.3 * aspectMult);
      } else if (itemKey === 'yattermen') {
        camera.position.set(3.4 * aspectMult, 3.8 * aspectMult, 7.9 * aspectMult);
      } else {
        camera.position.set(4.3 * aspectMult, 2.7 * aspectMult, 8.8 * aspectMult);
      }
      controls.target.set(0, isMobile ? -0.05 : 0.08, 0);
    }

    function switchArchiveItem(itemKey) {

      triggerBgAction('wave', { yRatio: 0.48, speed: 0.045, redAccent: true, intensity: 0.85 });

      ramuneGroup.visible = itemKey === 'ramune';
      sakuranboGroup.visible = itemKey === 'sakuranbo';
      yatterGroup.visible = itemKey === 'yattermen';

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.item === itemKey));

      applyResponsiveCamera(itemKey);
      renderDetailPanel(itemKey);
      buildDynamicControls(itemKey);
    }

    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchArchiveItem(btn.dataset.item)));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('detail-open')) { setDetailOpen(false); return; }
      if (e.repeat) return;
      const handler = activeKeyMap.get(e.code);
      if (handler && handler.down) handler.down();
    });
    window.addEventListener('keyup', (e) => {
      const handler = activeKeyMap.get(e.code);
      if (handler && handler.up) handler.up();
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function updatePointer(e) {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      updatePointer(e);
      raycaster.setFromCamera(pointer, camera);
      if (state.currentItem === 'ramune') {
        if (raycaster.intersectObject(rLidHit).length > 0) {
          controls.enabled = false; state.draggingCap = true; state.dragStartX = e.clientX; state.initialSlide = state.targetLidSlide; state.moved = false;
        }
      } else if (state.currentItem === 'sakuranbo') {
        const hits = raycaster.intersectObjects(jellyHitMeshes);
        if (hits.length > 0) triggerJellyPick(hits[0].object.userData.jellyIdx, { x: e.clientX, y: e.clientY });
      } else if (state.currentItem === 'yattermen') {
        if (raycaster.intersectObject(yLidHit).length > 0) toggleYatterLid();
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (state.draggingCap) {
        const dx = e.clientX - state.dragStartX;
        if (Math.abs(dx) > 4) state.moved = true;
        const next = Math.max(0, Math.min(0.66, state.initialSlide + dx * 0.0045));
        if (state.targetLidSlide < 0.33 && next >= 0.33) { audio.playSwitchClick(1500); triggerBgAction('wave', { yRatio: 0.25, speed: 0.05, redAccent: true, intensity: 0.7 }); }
        if (state.targetLidSlide >= 0.33 && next < 0.33) { audio.playSwitchClick(950); triggerBgAction('wave', { yRatio: 0.25, speed: 0.05, intensity: 0.6 }); }
        state.targetLidSlide = next;
        return;
      }
      updatePointer(e);
      raycaster.setFromCamera(pointer, camera);
      let hoverInteractive = false;
      if (state.currentItem === 'ramune') hoverInteractive = raycaster.intersectObject(rLidHit).length > 0;
      else if (state.currentItem === 'sakuranbo') hoverInteractive = raycaster.intersectObjects(jellyHitMeshes).length > 0;
      else if (state.currentItem === 'yattermen') hoverInteractive = raycaster.intersectObject(yLidHit).length > 0;
      renderer.domElement.style.cursor = hoverInteractive ? 'pointer' : 'grab';
    });

    window.addEventListener('pointerup', () => {
      if (state.draggingCap) {
        if (!state.moved) {
          const open = state.targetLidSlide < 0.33;
          state.targetLidSlide = open ? 0.66 : 0;
          audio.playSwitchClick(open ? 1500 : 950);
          triggerBgAction('wave', { yRatio: 0.25, speed: 0.05, redAccent: open, intensity: 0.7 });
        } else {
          state.targetLidSlide = state.targetLidSlide >= 0.33 ? 0.66 : 0;
        }
        state.draggingCap = false; controls.enabled = true;
      }
    });

    const seqPattern = [2, 3, 1, 3, 2, 2, 1, 3];
    const stepLabels = ['·', 'HI', 'MID', 'PRC'];
    const seqContainer = document.getElementById('seqSteps');
    const stepPads = [];

    seqPattern.forEach((initialMode, idx) => {
      const pad = document.createElement('button');
      pad.className = 'step-pad';
      pad.dataset.mode = String(initialMode);
      pad.textContent = stepLabels[initialMode];
      pad.addEventListener('click', () => {
        const nextMode = (seqPattern[idx] + 1) % 4;
        seqPattern[idx] = nextMode;
        pad.dataset.mode = String(nextMode);
        pad.textContent = stepLabels[nextMode];
        audio.playSwitchClick(1000 + nextMode * 200);
        triggerBgAction('flash', { speed: 0.06, redAccent: nextMode === 1, intensity: 0.5 });
      });
      seqContainer.appendChild(pad);
      stepPads.push(pad);
    });

    let isPlayingSeq = false, currentStep = 0, seqInterval = null;
    const playSeqBtn = document.getElementById('playSeqBtn');

    function tickSequencer() {
      stepPads.forEach((p, i) => p.classList.toggle('current', i === currentStep));
      const mode = seqPattern[currentStep];
      if (state.currentItem === 'ramune') {
        if (mode === 1) { audio.triggerStepWhistle(3136, state.lidSlide > 0.3); spawnSoundRing(); state.pulseBump = 0.045; }
        else if (mode === 2) { audio.triggerStepWhistle(2440, state.lidSlide > 0.3); spawnSoundRing(); state.pulseBump = 0.045; }
        else if (mode === 3) { audio.playTabletPerc(); triggerBgAction('flash', { speed: 0.055, intensity: 0.75 }); state.pulseBump = 0.03; rTablets.forEach(t => { t.vy += 0.018; }); }
      } else if (state.currentItem === 'sakuranbo') {
        if (mode === 1) triggerJellyPick((currentStep * 2) % 12);
        else if (mode === 2) triggerJellyPick(currentStep % 6);
        else if (mode === 3) { audio.playSwitchClick(1600); triggerBgAction('sparkle', { speed: 0.05, intensity: 0.8 }); state.pulseBump = 0.025; }
      } else if (state.currentItem === 'yattermen') {
        if (mode === 1) { audio.playNoodleCrunch(); triggerBgAction('sparkle', { speed: 0.05, redAccent: true, intensity: 1.0 }); state.pulseBump = 0.045; }
        else if (mode === 2) { audio.playFoilPeel(true); triggerBgAction('wave', { yRatio: 0.4, speed: 0.048, redAccent: true, intensity: 0.9 }); state.pulseBump = 0.035; }
        else if (mode === 3) { audio.playTabletPerc(); triggerBgAction('flash', { speed: 0.055, intensity: 0.8 }); state.yShakePower = 0.6; }
      }
      currentStep = (currentStep + 1) % 8;
    }

    playSeqBtn.addEventListener('click', () => {
      audio.playSwitchClick(1200);
      isPlayingSeq = !isPlayingSeq;
      const seqSt = document.getElementById('seqStatus');
      if (isPlayingSeq) {
        playSeqBtn.textContent = '■ STOP'; playSeqBtn.classList.add('pressed');
        if (seqSt) seqSt.textContent = 'PLAYING 135BPM';
        currentStep = 0; tickSequencer(); seqInterval = setInterval(tickSequencer, 220);
      } else {
        playSeqBtn.textContent = '▶ LOOP'; playSeqBtn.classList.remove('pressed');
        if (seqSt) seqSt.textContent = 'STOPPED';
        clearInterval(seqInterval); stepPads.forEach(p => p.classList.remove('current'));
      }
    });

    document.getElementById('clearSeqBtn').addEventListener('click', () => {
      audio.playSwitchClick(800);
      triggerBgAction('flash', { speed: 0.06, intensity: 0.5 });
      for (let i = 0; i < 8; i++) { seqPattern[i] = 0; stepPads[i].dataset.mode = '0'; stepPads[i].textContent = stepLabels[0]; }
    });

    switchArchiveItem('ramune');

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      applyResponsiveCamera(state.currentItem);
    });

    const clock = new THREE.Clock();
    let smoothSustain = 0;

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      const targetSustain = audio.activeVoices.size > 0 ? 1.0 : 0.0;
      smoothSustain += (targetSustain - smoothSustain) * 0.14;
      renderBgDots(time, smoothSustain);

      state.pulseBump *= 0.82;
      worldStage.position.y = 0.08 + Math.sin(time * 1.2) * 0.03 + state.pulseBump;

      if (state.currentItem === 'ramune') {
        state.lidSlide += (state.targetLidSlide - state.lidSlide) * 0.18;
        rLidGroup.position.x = state.lidSlide;
        const st = document.getElementById('statusVal');
        if (st && !state.isTilting) st.textContent = state.lidSlide > 0.33 ? 'CAP OPEN' : 'CAP LOCKED';

        const targetTilt = state.isTilting ? 2.1 : 0;
        state.tiltZ += (targetTilt - state.tiltZ) * 0.08;
        ramuneGroup.rotation.z = state.tiltZ;

        if (audio.activeVoices.size > 0 && Math.random() < 0.25) spawnSoundRing();
        for (let i = waveRings.length - 1; i >= 0; i--) {
          const w = waveRings[i];
          w.life += 0.035; w.mesh.position.x += 0.035;
          const s = 1 + w.life * 2.8;
          w.mesh.scale.set(1, s, s);
          w.mesh.material.opacity = Math.max(0, 0.9 * (1 - w.life));
          if (w.life >= 1) { ramuneGroup.remove(w.mesh); waveRings.splice(i, 1); }
        }

        const g = 0.0022, gx = Math.sin(state.tiltZ) * g, gy = -Math.cos(state.tiltZ) * g;
        const halfW = RW / 2 - 0.10, halfH = RH / 2 - 0.12;
        const holeMaxX = -halfW + Math.min(0.55, state.lidSlide);

        for (let i = rTablets.length - 1; i >= 0; i--) {
          const t = rTablets[i];
          t.vx = (t.vx + gx) * 0.88; t.vy = (t.vy + gy) * 0.88;
          t.x += t.vx; t.y += t.vy;
          if (t.x - t.r < -halfW) { t.x = -halfW + t.r; t.vx *= -0.1; }
          if (t.x + t.r > halfW) { t.x = halfW - t.r; t.vx *= -0.1; }
          if (t.y - t.r < -halfH) { t.y = -halfH + t.r; t.vy *= -0.1; }
          if (t.y + t.r > halfH) {
            if (state.lidSlide > 0.33 && t.x < holeMaxX + 0.05) {
              const wp = new THREE.Vector3(t.x, t.y, t.z);
              ramuneGroup.localToWorld(wp);
              const dm = createPointTablet(0.17, 0.12);
              dm.position.copy(wp); scene.add(dm);
              rFalling.push({ mesh: dm, vx: -0.015, vy: -0.005 });
              ramuneGroup.remove(t.mesh); rTablets.splice(i, 1);
              audio.playTabletPerc();
              triggerBgAction('sparkle', { speed: 0.05, intensity: 0.85 });
              continue;
            } else {
              t.y = halfH - t.r; t.vy *= -0.1;
            }
          }
          t.mesh.position.set(t.x, t.y, t.z);
        }
        for (let i = rFalling.length - 1; i >= 0; i--) {
          const f = rFalling[i];
          f.vy -= 0.0022; f.mesh.position.x += f.vx; f.mesh.position.y += f.vy;
          f.mesh.material.opacity -= 0.012;
          if (f.mesh.material.opacity <= 0) { scene.remove(f.mesh); rFalling.splice(i, 1); }
        }
      }

      if (state.currentItem === 'sakuranbo') {
        jellyCells.forEach(c => {
          c.lift *= 0.85; c.mesh.position.z = c.basePos.z + c.lift;
          const sc = 1 + c.lift * 0.45; c.mesh.scale.set(sc, sc, 1);
        });
        if (state.tpReturnTimer > 0) state.tpReturnTimer--;
        else state.tpTargetPos.copy(tpBasePos);
        toothpickGroup.position.lerp(state.tpTargetPos, 0.18);
      }

      if (state.currentItem === 'yattermen') {
        const targetLidRot = state.yLidOpen ? -Math.PI * 0.68 : 0;
        state.yLidAngle += (targetLidRot - state.yLidAngle) * 0.16;
        yatterLidPivot.rotation.x = state.yLidAngle;
        if (state.yShakePower > 0.01) {
          yatterGroup.position.x = Math.sin(time * 55) * 0.09 * state.yShakePower;
          noodleGroup.position.y = Math.abs(Math.sin(time * 40)) * 0.12 * state.yShakePower;
          state.yShakePower *= 0.9;
        } else {
          yatterGroup.position.x = 0; noodleGroup.position.y = 0;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
