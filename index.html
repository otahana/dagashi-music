<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAGASHI ARCHIVE (01–03) — TACTILE 3D SOUND COLLECTION</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Silkscreen:wght@400;700&display=swap');

    :root {
      --bg: #0d0e11;
      --surface: rgba(24, 26, 30, 0.86);
      --border: rgba(255, 255, 255, 0.18);
      --text-main: #f8f8fa;
      --text-dim: #92969e;
      --nothing-red: #e01e26;
      --nothing-red-glow: rgba(224, 30, 38, 0.48);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'JetBrains Mono', 'Noto Sans JP', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* 背景のドットグリッド＆ほんのりスタジオ光 */
    .bg-dots {
      position: fixed;
      inset: 0;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
        radial-gradient(rgba(255, 255, 255, 0.11) 1px, transparent 1px);
      background-size: 100% 100%, 26px 26px;
      pointer-events: none;
      z-index: 0;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }

    #webgl-container:active {
      cursor: grabbing;
    }

    /* HUD レイヤー */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px 34px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .rec-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--nothing-red);
      box-shadow: 0 0 10px var(--nothing-red);
    }

    .brand-title {
      font-family: 'Silkscreen', monospace;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text-main);
    }

    .brand-meta {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    /* アーカイブ切り替えスイッチャー（01 / 02 / 03） */
    .archive-switcher {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(20, 22, 26, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.07);
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #2e313a 0%, #1c1e24 100%);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .tab-btn.active .tab-num {
      color: var(--nothing-red);
    }

    /* 右上詳細ボタン */
    .top-actions {
      pointer-events: auto;
    }

    .tactile-pill {
      background: linear-gradient(180deg, #22242a 0%, #15161a 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 0 #050507, 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tactile-pill:active, .tactile-pill.is-active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #050507, 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .tactile-pill.is-active {
      border-color: var(--nothing-red);
    }

    .led-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
    }

    .tactile-pill.is-active .led-indicator {
      background: var(--nothing-red);
      box-shadow: 0 0 8px var(--nothing-red);
    }

    /* 駄菓子詳細パネル */
    .detail-panel {
      position: fixed;
      right: 34px;
      top: 86px;
      width: 315px;
      background: rgba(16, 18, 22, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px dashed rgba(255, 255, 255, 0.26);
      border-radius: 14px;
      padding: 20px;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(-8px);
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7);
    }

    body.detail-open .detail-panel {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      color: var(--nothing-red);
      margin-bottom: 14px;
      letter-spacing: 0.08em;
    }

    .detail-block {
      margin-bottom: 13px;
      padding-bottom: 13px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.14);
    }

    .detail-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .detail-k {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail-v {
      font-size: 12px;
      line-height: 1.6;
      color: #ececef;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .spec-cell {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 8px;
    }

    .spec-cell-label {
      font-size: 9px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .spec-cell-val {
      font-size: 11px;
      color: #fff;
      font-weight: 600;
      margin-top: 2px;
    }

    /* フッター＆メカニカルコンソール */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .telemetry {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.7;
      letter-spacing: 0.04em;
    }

    .telemetry span {
      color: var(--text-main);
    }

    .console-dock {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(20, 22, 26, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 14px 16px;
      border-radius: 20px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .console-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .console-label {
      font-family: 'Silkscreen', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin-right: 4px;
    }

    /* 物理キースイッチ風ボタン */
    .mech-btn {
      position: relative;
      background: linear-gradient(180deg, #2a2d34 0%, #1a1c20 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 0 #09090b, 0 6px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.06s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.06s ease, background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .mech-btn:hover {
      background: linear-gradient(180deg, #343840 0%, #212328 100%);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .mech-btn:active, .mech-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b, 0 2px 4px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .mech-btn.red-key {
      background: linear-gradient(180deg, #eb252d 0%, #b81219 100%);
      border-color: #ff666d;
      box-shadow: 0 4px 0 #5e070b, 0 6px 16px var(--nothing-red-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .mech-btn.red-key:active, .mech-btn.red-key.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5e070b, 0 2px 8px var(--nothing-red-glow);
    }

    .note-keys {
      display: flex;
      gap: 6px;
    }

    .note-key {
      width: 38px;
      height: 44px;
      padding: 0;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .note-key .note-name { font-size: 11px; font-weight: 700; }
    .note-key .key-bind { font-size: 8px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

    /* 8ステップ・シーケンサー */
    .sequencer-row {
      border-top: 1px dashed rgba(255, 255, 255, 0.14);
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .seq-steps {
      display: flex;
      gap: 5px;
    }

    .step-pad {
      width: 30px;
      height: 28px;
      border-radius: 6px;
      background: #181a1e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 2px 0 #050507, inset 0 1px 0 rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.05s, background 0.12s, border-color 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--text-dim);
    }

    .step-pad:active { transform: translateY(2px); }
    .step-pad[data-mode="1"] { background: rgba(224, 30, 38, 0.3); border-color: var(--nothing-red); color: #fff; }
    .step-pad[data-mode="2"] { background: rgba(255, 255, 255, 0.22); border-color: #fff; color: #fff; }
    .step-pad[data-mode="3"] { background: rgba(255, 255, 255, 0.1); border-style: dashed; border-color: rgba(255, 255, 255, 0.55); color: #ddd; }
    .step-pad.current { outline: 2px solid var(--nothing-red); outline-offset: 1px; box-shadow: 0 0 12px var(--nothing-red-glow); }

    @media (max-width: 860px) {
      .hud { padding: 16px; }
      footer { flex-direction: column; align-items: stretch; }
      .detail-panel { left: 16px; right: 16px; width: auto; top: 130px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

        specs: [

    /**
     * 2. Web Audio API マルチシンセサイザー
     */
    class MultiDagashiSynth {
      constructor() {
        this.ctx = null;
        this.activeVoices = new Map();
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      playSwitchClick(pitch = 1200) {
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, t);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.022);
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.022);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.025);
      }

      playTabletPerc() {
        this.init();
        const t = this.ctx.currentTime;
        for (let i = 0; i < 2; i++) {
          const d = i * 0.022;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2200 + i * 600, t + d);
          osc.frequency.exponentialRampToValueAtTime(520, t + d + 0.025);
          gain.gain.setValueAtTime(0.11, t + d);
          gain.gain.exponentialRampToValueAtTime(0.001, t + d + 0.025);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + d);
          osc.stop(t + d + 0.03);
        }
      }

      startWhistle(id, baseFreq, isLidOpen) {
        this.init();
        if (this.activeVoices.has(id)) return;
        const t = this.ctx.currentTime;
        const freq = isLidOpen ? baseFreq * 1.12 : baseFreq;

        const osc = this.ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq * 0.97, t);
        osc.frequency.linearRampToValueAtTime(freq, t + 0.025);

        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.value = 18;
        lfoGain.gain.value = isLidOpen ? 38 : 16;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 3800;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(isLidOpen ? 0.05 : 0.1, t + 0.02);

        osc.connect(lp);
        lp.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(t);
        lfo.start(t);
        this.activeVoices.set(id, { osc, lfo, gain });
      }

      stopWhistle(id) {
        const v = this.activeVoices.get(id);
        if (!v) return;
        const t = this.ctx.currentTime;
        v.gain.gain.setValueAtTime(v.gain.gain.value, t);
        v.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
        setTimeout(() => { try { v.osc.stop(); v.lfo.stop(); } catch (e) {} }, 40);
        this.activeVoices.delete(id);
      }

      triggerStepWhistle(freq, isLidOpen) {
        const id = 'seq_' + Math.random();
        this.startWhistle(id, freq, isLidOpen);
        setTimeout(() => this.stopWhistle(id), 120);
      }

      playJellyNote(freq) {
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const sub = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * 0.92, t);
        osc.frequency.exponentialRampToValueAtTime(freq, t + 0.03);

        sub.type = 'triangle';
        sub.frequency.setValueAtTime(freq * 2, t);

        const subGain = this.ctx.createGain();
        subGain.gain.setValueAtTime(0.06, t);
        subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.22, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);

        osc.connect(gain);
        sub.connect(subGain);
        subGain.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(t);
        sub.start(t);
        osc.stop(t + 0.34);
        sub.stop(t + 0.34);
      }

      playFoilPeel(isOpening) {
        this.init();
        const t = this.ctx.currentTime;
        const dur = 0.18;
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.sin((i / data.length) * Math.PI);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(isOpening ? 2800 : 4200, t);
        filter.frequency.linearRampToValueAtTime(isOpening ? 5600 : 2200, t + dur);
        filter.Q.value = 3.5;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(t);
      }

      playNoodleCrunch() {
        this.init();

          const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let j = 0; j < data.length; j++) data[j] = Math.random() * 2 - 1;
          const src = this.ctx.createBufferSource();
          src.buffer = buf;

          const hp = this.ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 1800 + Math.random() * 1200;

          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.18, t + d);
          g.gain.exponentialRampToValueAtTime(0.001, t + d + dur);

          src.connect(hp);
          hp.connect(g);
          g.connect(this.ctx.destination);
          src.start(t + d);
        }
      }

    function createCircleDotTexture() {
      const c = document.createElement('canvas');

      const grad = g.createRadialGradient(16, 16, 2, 16, 16, 15);

      grad.addColorStop(0.75, 'rgba(255, 255, 255, 0.92)');

      g.beginPath();

      return new THREE.CanvasTexture(c);
    }
    const dotTex = createCircleDotTexture();

    function createPointBox(w, h, d, density, pointSize, opacity, edgeBoost = true, color = 0xffffff) {
      const positions = [];
      const step = 1 / density;
      for (let x = -w / 2; x <= w / 2 + 0.0001; x += step) {
        for (let y = -h / 2; y <= h / 2 + 0.0001; y += step) {
          positions.push(x, y, d / 2, x, y, -d / 2);
        }
      }
      for (let z = -d / 2 + step; z <= d / 2 - step + 0.0001; z += step) {
        for (let y = -h / 2; y <= h / 2 + 0.0001; y += step) {
          positions.push(w / 2, y, z, -w / 2, y, z);
        }
      }
      for (let x = -w / 2 + step; x <= w / 2 - step + 0.0001; x += step) {
        for (let z = -d / 2 + step; z <= d / 2 - step + 0.0001; z += step) {
          positions.push(x, h / 2, z, x, -h / 2, z);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color, size: pointSize, map: dotTex, transparent: true, opacity, depthWrite: false
      });
      const group = new THREE.Group();
      group.add(new THREE.Points(geo, mat));
      if (edgeBoost) {
        const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d));
        group.add(new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color, transparent: true, opacity: Math.min(1, opacity * 0.85) })
        ));
      }
      return group;
    }

          }
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      return new THREE.Points(geo, new THREE.PointsMaterial({

    function createPointTablet(radius, height) {
      const pts = [];

          const rad = (r / 3) * radius;
          for (let i = 0; i < r * 8; i++) {
            const a = (i / (r * 8)) * Math.PI * 2;
            pts.push(Math.cos(a) * rad, Math.sin(a) * rad, side);

      for (let i = 0; i < 24; i++) {

      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      return new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffffff, size: 0.028, map: dotTex, transparent: true, opacity: 1.0, depthWrite: false
      }));

    function createPillowBagPoints(w, h, maxDepth) {
      const pts = [];
      const nx = 34, ny = 48;
      for (let iy = 0; iy <= ny; iy++) {
        const v = iy / ny; // 0..1
        const y = (v - 0.5) * h;
        // 上下端に向かって薄く圧着されるピローカーブ
        const envY = Math.sin(v * Math.PI);
        for (let ix = 0; ix <= nx; ix++) {
          const u = ix / nx; // 0..1
          const x = (u - 0.5) * w;
          // 左右端に向かって薄くなるピローカーブ
          const envX = Math.sin(u * Math.PI);
          const zBulge = (maxDepth * 0.5) * Math.pow(envX, 0.55) * Math.pow(envY, 0.35);
          pts.push(x, y, zBulge);
          pts.push(x, y, -zBulge);
        }
      }
      // 背面中央の縦センターシール（合掌貼りフィン）
      for (let iy = 0; iy <= ny; iy++) {
        const v = iy / ny;
        const y = (v - 0.5) * h;
        const envY = Math.sin(v * Math.PI);
        const baseZ = -(maxDepth * 0.5) * Math.pow(envY, 0.35);
        pts.push(0.02, y, baseZ - 0.02);
        pts.push(0.02, y, baseZ - 0.06);
        pts.push(0.02, y, baseZ - 0.10);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      return new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffffff, size: 0.017, map: dotTex, transparent: true, opacity: 0.36, depthWrite: false
      }));
    }

    }, 200, 300, SW - 0.24, SH - 0.30, -SD * 0.46, 3, 0.016, 0xffffff, 0.42);
    sakuranboGroup.add(sBackPrint);

    // 4) 12粒のキューブもちゼリー（丸みのある立方体点群）
    const jellyNotes = [
      1046.5, 1174.7, 1318.5,
      1568.0, 1760.0, 2093.0,
      2349.3, 2637.0, 3136.0,
      1046.5, 1318.5, 1568.0
    ];
    const jellyCells = [];
    const jellyHitMeshes = [];

    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 3; col++) {
        const idx = row * 3 + col;
        const jx = -0.24 + col * 0.41;
        const jy = 0.76 - row * 0.50;
        const jz = 0.01;

        const cube = createPointBox(0.29, 0.29, 0.14, 20, 0.022, 0.94, true);
        cube.position.set(jx, jy, jz);
        sakuranboGroup.add(cube);

        const hit = new THREE.Mesh(
          new THREE.BoxGeometry(0.36, 0.36, 0.24),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hit.position.set(jx, jy, jz);
        hit.userData = { jellyIdx: idx };
        sakuranboGroup.add(hit);
        jellyHitMeshes.push(hit);

        jellyCells.push({
          mesh: cube,
          basePos: new THREE.Vector3(jx, jy, jz),
          lift: 0,
          freq: jellyNotes[idx]
        });
      }
    }

    // 5) 左端のつまようじ（上端の尖り＋溝のくびれまで再現）
    const toothpickGroup = new THREE.Group();
    const tpBasePos = new THREE.Vector3(-0.64, 0.04, 0.02);
    toothpickGroup.position.copy(tpBasePos);
    sakuranboGroup.add(toothpickGroup);

    const tpPts = [];
    for (let y = -0.92; y <= 0.92; y += 0.025) {
      let r = 0.028;
      if (y > 0.62) {
        r = 0.028 * Math.max(0.05, (0.92 - y) / 0.30); // 先端の尖り
      } else if (y < -0.78 && y > -0.86) {
        r = 0.016; // 持ち手側のくびれ装飾
      }
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
        tpPts.push(Math.cos(a) * r, y, Math.sin(a) * r);
      }
    }
    const tpGeo = new THREE.BufferGeometry();
    tpGeo.setAttribute('position', new THREE.Float32BufferAttribute(tpPts, 3));
    toothpickGroup.add(new THREE.Points(tpGeo, new THREE.PointsMaterial({
      color: 0xe01e26, size: 0.024, map: dotTex, transparent: true, opacity: 1.0
    })));

    // ==========================================
    // MODEL 03: ヤッター！めん（輝度・視認性アップ）
    // ==========================================
    const yatterGroup = new THREE.Group();
    yatterGroup.visible = false;
    worldStage.add(yatterGroup);

    const cupPts = [];
    const cupH = 0.95;
    for (let i = 0; i <= 18; i++) {
      const t = i / 18;
      const y = -cupH / 2 + t * cupH;
      const r = 0.62 + t * 0.26;
      const segs = 48;
      for (let s = 0; s < segs; s++) {
        const a = (s / segs) * Math.PI * 2;
        cupPts.push(Math.cos(a) * r, y, Math.sin(a) * r);
      }
    }
    const cupGeo = new THREE.BufferGeometry();
    cupGeo.setAttribute('position', new THREE.Float32BufferAttribute(cupPts, 3));
    yatterGroup.add(new THREE.Points(cupGeo, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.022, map: dotTex, transparent: true, opacity: 0.62
    })));

    const flange = createPointBox(2.05, 0.06, 2.05, 16, 0.021, 0.78, true);
    flange.position.y = cupH / 2;
    yatterGroup.add(flange);

    const noodleGroup = new THREE.Group();
    yatterGroup.add(noodleGroup);
    const noodlePts = [];
    for (let n = 0; n < 26; n++) {
      let nx = (Math.random() - 0.5) * 0.9;
      let ny = -0.15 + Math.random() * 0.45;
      let nz = (Math.random() - 0.5) * 0.9;
      let ang = Math.random() * Math.PI * 2;
      for (let step = 0; step < 12; step++) {
        ang += (Math.random() - 0.5) * 1.4;
        nx += Math.cos(ang) * 0.035;
        nz += Math.sin(ang) * 0.035;
        ny += (Math.random() - 0.5) * 0.02;
        if (Math.hypot(nx, nz) < 0.68) noodlePts.push(nx, ny, nz);
      }
    }
    const noodleGeo = new THREE.BufferGeometry();
    noodleGeo.setAttribute('position', new THREE.Float32BufferAttribute(noodlePts, 3));
    noodleGroup.add(new THREE.Points(noodleGeo, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.026, map: dotTex, transparent: true, opacity: 0.95
    })));

    const yatterLidPivot = new THREE.Group();
    yatterLidPivot.position.set(0, cupH / 2 + 0.04, -1.02);
    yatterGroup.add(yatterLidPivot);

    const yLidMesh = createPointBox(2.05, 0.04, 2.05, 18, 0.022, 0.88, true);
    yLidMesh.position.set(0, 0, 1.02);
    yatterLidPivot.add(yLidMesh);

    const yFrontLogo = createCanvasPointMatrix((g, cw, ch) => {
      g.strokeStyle = '#fff'; g.lineWidth = 3; g.strokeRect(4, 4, cw - 8, ch - 8);
      g.fillStyle = '#fff'; g.font = '900 28px sans-serif'; g.textAlign = 'center';
      g.fillText('ヤッター！', cw / 2, 52);
      g.font = 'bold 22px sans-serif';
      g.fillText('めん', cw / 2 + 38, 82);
      g.beginPath(); g.arc(46, 112, 24, 0, Math.PI * 2); g.stroke();
      g.font = 'bold 14px monospace';
      g.fillText('100', 46, 117);
      g.beginPath(); g.arc(124, 122, 30, 0, Math.PI * 2); g.stroke();
    }, 180, 180, 1.9, 1.9, 0.03, 2, 0.023, 0xffffff, 0.96);
    yFrontLogo.rotation.x = -Math.PI / 2;
    yFrontLogo.position.set(0, 0.025, 1.02);
    yatterLidPivot.add(yFrontLogo);

    let currentLotteryText = '100円 当たり!';
    let yBackLotteryMesh = null;

    function updateLotteryMesh(text) {
      if (yBackLotteryMesh) yatterLidPivot.remove(yBackLotteryMesh);
      yBackLotteryMesh = createCanvasPointMatrix((g, cw, ch) => {
        g.strokeStyle = '#fff'; g.lineWidth = 4;
        g.beginPath(); g.ellipse(cw / 2, ch / 2, 74, 42, 0, 0, Math.PI * 2); g.stroke();
        g.fillStyle = '#fff'; g.font = '900 26px sans-serif'; g.textAlign = 'center';
        g.fillText(text, cw / 2, ch / 2 + 9);
      }, 180, 120, 1.5, 1.0, 0.03, 2, 0.026, 0xe01e26, 1.0);
      yBackLotteryMesh.rotation.x = Math.PI / 2;
      yBackLotteryMesh.position.set(0, -0.025, 1.02);
      yatterLidPivot.add(yBackLotteryMesh);
    }
    updateLotteryMesh(currentLotteryText);

    const yLidHit = new THREE.Mesh(
      new THREE.BoxGeometry(2.15, 0.25, 2.15),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    yLidHit.position.set(0, 0, 1.02);
    yatterLidPivot.add(yLidHit);

    /**
     * 5. 状態管理＆UI切り替えロジック
     */
    const state = {
      currentItem: 'ramune',
      lidSlide: 0,
      targetLidSlide: 0,
      tiltZ: 0,
      isTilting: false,
      draggingCap: false,
      dragStartX: 0,
      initialSlide: 0,
      moved: false,
      tpTargetPos: tpBasePos.clone(),
      tpReturnTimer: 0,
      yLidOpen: false,
      yLidAngle: 0,
      yShakePower: 0,
      pulseBump: 0
    };

    const detailPanelEl = document.getElementById('detailPanel');
    const dynamicControlsEl = document.getElementById('dynamicControls');
    const seqModeLabelEl = document.getElementById('seqModeLabel');

    function renderDetailPanel(itemKey) {
      const d = ARCHIVE_DATA[itemKey];
      document.getElementById('brandEyebrow').textContent = d.eyebrow;
      document.getElementById('brandTitle').textContent = d.title;
      document.getElementById('brandMeta').textContent = d.meta;
      document.getElementById('telemetryText').innerHTML =
        `${d.hint}<br>STATUS: <span id="statusVal">READY</span> &nbsp;//&nbsp; SEQ: <span id="seqStatus">${isPlayingSeq ? 'PLAYING 135BPM' : 'STOPPED'}</span>`;

      detailPanelEl.innerHTML = `
        <div class="detail-header">
          <span>${d.headerTag}</span>
          <span>${d.era}</span>
        </div>
        <div class="detail-block">
          <div class="detail-k">Product Name / Maker</div>
          <div class="detail-v"><strong>${d.name}</strong><br>${d.maker}</div>
        </div>
        <div class="detail-block">
          <div class="detail-k">Industrial Structure</div>
          <div class="detail-v">${d.structure}</div>
        </div>
        <div class="detail-block">
          <div class="detail-k">Hardware & Flavor Specs</div>
          <div class="spec-grid">
            ${d.specs.map(s => `
              <div class="spec-cell">
                <div class="spec-cell-label">${s.k}</div>
                <div class="spec-cell-val">${s.v}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    let activeKeyMap = new Map();

    function buildDynamicControls(itemKey) {
      activeKeyMap.clear();

      if (itemKey === 'ramune') {
        seqModeLabelEl.textContent = 'WHISTLE BEAT';
        dynamicControlsEl.innerHTML = `
          <span class="console-label">WHISTLE</span>
          <div class="note-keys">
            <button class="mech-btn note-key" data-freq="1760" data-key="KeyA"><span class="note-name">A5</span><span class="key-bind">A</span></button>
            <button class="mech-btn note-key" data-freq="2093" data-key="KeyS"><span class="note-name">C6</span><span class="key-bind">S</span></button>
            <button class="mech-btn note-key" data-freq="2349" data-key="KeyD"><span class="note-name">D6</span><span class="key-bind">D</span></button>
            <button class="mech-btn note-key red-key" data-freq="2440" data-key="KeyF"><span class="note-name">ORG</span><span class="key-bind">F</span></button>
            <button class="mech-btn note-key" data-freq="2793" data-key="KeyG"><span class="note-name">F6</span><span class="key-bind">G</span></button>
            <button class="mech-btn note-key" data-freq="3136" data-key="KeyH"><span class="note-name">G6</span><span class="key-bind">H</span></button>
          </div>
          <button id="lidBtn" class="mech-btn">SLIDE CAP</button>
          <button id="tiltBtn" class="mech-btn">TILT</button>
          <button id="resetBtn" class="mech-btn" title="Refill">↻</button>
        `;

        dynamicControlsEl.querySelectorAll('.note-key').forEach(btn => {
          const freq = Number(btn.dataset.freq);
          const code = btn.dataset.key;
          const down = () => {
            btn.classList.add('pressed');
            audio.startWhistle(code, freq, state.lidSlide > 0.3);
            spawnSoundRing();
            state.pulseBump = 0.04;
          };
          const up = () => {
            btn.classList.remove('pressed');
            audio.stopWhistle(code);
          };
          btn.addEventListener('pointerdown', down);
          btn.addEventListener('pointerup', up);
          btn.addEventListener('pointerleave', up);
          activeKeyMap.set(code, { down, up });
        });

        document.getElementById('lidBtn').addEventListener('click', () => {
          const open = state.targetLidSlide < 0.33;
          state.targetLidSlide = open ? 0.66 : 0;
          audio.playSwitchClick(open ? 1500 : 950);
        });

        const tiltBtn = document.getElementById('tiltBtn');
        tiltBtn.addEventListener('pointerdown', () => {
          audio.playSwitchClick(900);
          state.isTilting = true;
          tiltBtn.classList.add('pressed');
          if (state.targetLidSlide < 0.33) state.targetLidSlide = 0.66;
        });
        const stopT = () => { state.isTilting = false; tiltBtn.classList.remove('pressed'); };
        tiltBtn.addEventListener('pointerup', stopT);
        tiltBtn.addEventListener('pointerleave', stopT);

        document.getElementById('resetBtn').addEventListener('click', () => {
          audio.playSwitchClick(1300);
          initRamuneTablets();
        });

      } else if (itemKey === 'sakuranbo') {
        seqModeLabelEl.textContent = 'JELLY SCALE';
        dynamicControlsEl.innerHTML = `
          <span class="console-label">JELLY KEYS</span>
          <div class="note-keys">
            <button class="mech-btn note-key" data-idx="0" data-key="KeyA"><span class="note-name">C6</span><span class="key-bind">A</span></button>
            <button class="mech-btn note-key" data-idx="1" data-key="KeyS"><span class="note-name">D6</span><span class="key-bind">S</span></button>
            <button class="mech-btn note-key" data-idx="2" data-key="KeyD"><span class="note-name">E6</span><span class="key-bind">D</span></button>
            <button class="mech-btn note-key red-key" data-idx="3" data-key="KeyF"><span class="note-name">G6</span><span class="key-bind">F</span></button>
            <button class="mech-btn note-key" data-idx="4" data-key="KeyG"><span class="note-name">A6</span><span class="key-bind">G</span></button>
            <button class="mech-btn note-key" data-idx="5" data-key="KeyH"><span class="note-name">C7</span><span class="key-bind">H</span></button>
          </div>
          <button id="pickRandBtn" class="mech-btn">PICK JELLY</button>
        `;

        dynamicControlsEl.querySelectorAll('.note-key').forEach(btn => {
          const idx = Number(btn.dataset.idx);
          const code = btn.dataset.key;
          const down = () => {
            btn.classList.add('pressed');
            triggerJellyPick(idx);
          };
          const up = () => btn.classList.remove('pressed');
          btn.addEventListener('pointerdown', down);
          btn.addEventListener('pointerup', up);
          btn.addEventListener('pointerleave', up);
          activeKeyMap.set(code, { down, up });
        });

        document.getElementById('pickRandBtn').addEventListener('click', () => {
          triggerJellyPick(Math.floor(Math.random() * 12));
        });

      } else if (itemKey === 'yattermen') {
        seqModeLabelEl.textContent = 'CRUNCH BEAT';
        dynamicControlsEl.innerHTML = `
          <span class="console-label">ACTIONS</span>
          <button id="peelLidBtn" class="mech-btn red-key" data-key="KeyA">PEEL LID [A]</button>
          <button id="crunchBtn" class="mech-btn" data-key="KeyS">CRUNCH [S]</button>
          <button id="shakeCupBtn" class="mech-btn" data-key="KeyD">SHAKE CUP [D]</button>
          <button id="newLotteryBtn" class="mech-btn" data-key="KeyF">NEW CUP [F]</button>
        `;

        const bindBtn = (id, fn) => {
          const b = document.getElementById(id);
          const code = b.dataset.key;
          const down = () => { b.classList.add('pressed'); fn(); };
          const up = () => b.classList.remove('pressed');
          b.addEventListener('pointerdown', down);
          b.addEventListener('pointerup', up);
          b.addEventListener('pointerleave', up);
          activeKeyMap.set(code, { down, up });
        };

        bindBtn('peelLidBtn', toggleYatterLid);
        bindBtn('crunchBtn', () => {
          audio.playNoodleCrunch();
          state.pulseBump = 0.045;
          document.getElementById('statusVal').textContent = 'CRUNCHY!';
        });
        bindBtn('shakeCupBtn', () => {
          audio.playTabletPerc();
          state.yShakePower = 1.0;
          document.getElementById('statusVal').textContent = 'SHAKING CUP';
        });
        bindBtn('newLotteryBtn', () => {
          audio.playSwitchClick(1350);
          state.yLidOpen = false;
          drawNewLottery();
          document.getElementById('statusVal').textContent = 'NEW SEALED CUP';
        });
      }
    }

    function triggerJellyPick(idx) {
      const cell = jellyCells[idx];
      if (!cell) return;
      cell.lift = 0.24;
      state.tpTargetPos.set(cell.basePos.x, cell.basePos.y + 0.15, cell.basePos.z + 0.24);
      state.tpReturnTimer = 28;
      audio.playJellyNote(cell.freq);
      state.pulseBump = 0.025;
      const st = document.getElementById('statusVal');
      if (st) st.textContent = `CELL #${String(idx + 1).padStart(2, '0')} (${Math.round(cell.freq)}Hz)`;
    }

    function drawNewLottery() {
      const pool = ['100円 当たり!', '50円 当たり!', '10円 当たり!', '10円 当たり!', 'はずれ...'];
      currentLotteryText = pool[Math.floor(Math.random() * pool.length)];
      updateLotteryMesh(currentLotteryText);
    }

    function toggleYatterLid() {
      state.yLidOpen = !state.yLidOpen;
      audio.playFoilPeel(state.yLidOpen);
      const st = document.getElementById('statusVal');
      if (state.yLidOpen) {
        if (currentLotteryText.includes('当たり')) {
          setTimeout(() => audio.playWinChime(), 160);
        }
        if (st) st.textContent = `LOTTERY: ${currentLotteryText}`;
      } else {
        if (st) st.textContent = 'LID SEALED';
      }
    }

    function switchArchiveItem(itemKey) {
      state.currentItem = itemKey;
      audio.playSwitchClick(1250);

      ramuneGroup.visible = itemKey === 'ramune';
      sakuranboGroup.visible = itemKey === 'sakuranbo';
      yatterGroup.visible = itemKey === 'yattermen';

      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.item === itemKey);
      });

      if (itemKey === 'sakuranbo') {
        camera.position.set(0.8, 0.35, 6.0);
      } else if (itemKey === 'yattermen') {
        camera.position.set(2.4, 2.8, 5.6);
      } else {
        camera.position.set(3.2, 2.0, 6.4);
      }
      controls.target.set(0, 0.15, 0);

      renderDetailPanel(itemKey);
      buildDynamicControls(itemKey);
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchArchiveItem(btn.dataset.item));
    });

    const detailBtn = document.getElementById('detailBtn');
    detailBtn.addEventListener('click', () => {
      audio.playSwitchClick(1100);
      const open = document.body.classList.toggle('detail-open');
      detailBtn.classList.toggle('is-active', open);
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const handler = activeKeyMap.get(e.code);
      if (handler && handler.down) handler.down();
    });
    window.addEventListener('keyup', (e) => {
      const handler = activeKeyMap.get(e.code);
      if (handler && handler.up) handler.up();
    });

    /**
     * 6. 3D直接クリック＆ドラッグ判定
     */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function updatePointer(e) {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      updatePointer(e);
      raycaster.setFromCamera(pointer, camera);

      if (state.currentItem === 'ramune') {
        if (raycaster.intersectObject(rLidHit).length > 0) {
          controls.enabled = false;
          state.draggingCap = true;
          state.dragStartX = e.clientX;
          state.initialSlide = state.targetLidSlide;
          state.moved = false;
        }
      } else if (state.currentItem === 'sakuranbo') {
        const hits = raycaster.intersectObjects(jellyHitMeshes);
        if (hits.length > 0) {
          triggerJellyPick(hits[0].object.userData.jellyIdx);
        }
      } else if (state.currentItem === 'yattermen') {
        if (raycaster.intersectObject(yLidHit).length > 0) {
          toggleYatterLid();
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (state.draggingCap) {
        const dx = e.clientX - state.dragStartX;
        if (Math.abs(dx) > 4) state.moved = true;
        const next = Math.max(0, Math.min(0.66, state.initialSlide + dx * 0.0045));
        if (state.targetLidSlide < 0.33 && next >= 0.33) audio.playSwitchClick(1500);
        if (state.targetLidSlide >= 0.33 && next < 0.33) audio.playSwitchClick(950);
        state.targetLidSlide = next;
        return;
      }

      updatePointer(e);
      raycaster.setFromCamera(pointer, camera);
      let hoverInteractive = false;
      if (state.currentItem === 'ramune') {
        hoverInteractive = raycaster.intersectObject(rLidHit).length > 0;
      } else if (state.currentItem === 'sakuranbo') {
        hoverInteractive = raycaster.intersectObjects(jellyHitMeshes).length > 0;
      } else if (state.currentItem === 'yattermen') {
        hoverInteractive = raycaster.intersectObject(yLidHit).length > 0;
      }
      renderer.domElement.style.cursor = hoverInteractive ? 'pointer' : 'grab';
    });

    window.addEventListener('pointerup', () => {
      if (state.draggingCap) {
        if (!state.moved) {
          const open = state.targetLidSlide < 0.33;
          state.targetLidSlide = open ? 0.66 : 0;
          audio.playSwitchClick(open ? 1500 : 950);
        } else {
          state.targetLidSlide = state.targetLidSlide >= 0.33 ? 0.66 : 0;
        }
        state.draggingCap = false;
        controls.enabled = true;
      }
    });

    /**
     * 7. 8ステップ・マルチ音源シーケンサー
     */
    const seqPattern = [2, 3, 1, 3, 2, 2, 1, 3];
    const stepLabels = ['·', 'HI', 'MID', 'PRC'];
    const seqContainer = document.getElementById('seqSteps');
    const stepPads = [];

    seqPattern.forEach((initialMode, idx) => {
      const pad = document.createElement('button');
      pad.className = 'step-pad';
      pad.dataset.mode = String(initialMode);
      pad.textContent = stepLabels[initialMode];
      pad.addEventListener('click', () => {
        const nextMode = (seqPattern[idx] + 1) % 4;
        seqPattern[idx] = nextMode;
        pad.dataset.mode = String(nextMode);
        pad.textContent = stepLabels[nextMode];
        audio.playSwitchClick(1000 + nextMode * 200);
      });
      seqContainer.appendChild(pad);
      stepPads.push(pad);
    });

    let isPlayingSeq = false;
    let currentStep = 0;
    let seqInterval = null;
    const playSeqBtn = document.getElementById('playSeqBtn');

    function tickSequencer() {
      stepPads.forEach((p, i) => p.classList.toggle('current', i === currentStep));
      const mode = seqPattern[currentStep];

      if (state.currentItem === 'ramune') {
        if (mode === 1) { audio.triggerStepWhistle(3136, state.lidSlide > 0.3); spawnSoundRing(); state.pulseBump = 0.045; }
        else if (mode === 2) { audio.triggerStepWhistle(2440, state.lidSlide > 0.3); spawnSoundRing(); state.pulseBump = 0.045; }
        else if (mode === 3) { audio.playTabletPerc(); state.pulseBump = 0.03; rTablets.forEach(t => { t.vy += 0.018; }); }
      } else if (state.currentItem === 'sakuranbo') {
        if (mode === 1) { triggerJellyPick((currentStep * 2) % 12); }
        else if (mode === 2) { triggerJellyPick(currentStep % 6); }
        else if (mode === 3) { audio.playSwitchClick(1600); state.pulseBump = 0.025; }
      } else if (state.currentItem === 'yattermen') {
        if (mode === 1) { audio.playNoodleCrunch(); state.pulseBump = 0.045; }
        else if (mode === 2) { audio.playFoilPeel(true); state.pulseBump = 0.035; }
        else if (mode === 3) { audio.playTabletPerc(); state.yShakePower = 0.6; }
      }

      currentStep = (currentStep + 1) % 8;
    }

    playSeqBtn.addEventListener('click', () => {
      audio.playSwitchClick(1200);
      isPlayingSeq = !isPlayingSeq;
      const seqSt = document.getElementById('seqStatus');
      if (isPlayingSeq) {
        playSeqBtn.textContent = '■ STOP';
        playSeqBtn.classList.add('pressed');
        if (seqSt) seqSt.textContent = 'PLAYING 135BPM';
        currentStep = 0;
        tickSequencer();
        seqInterval = setInterval(tickSequencer, 220);
      } else {
        playSeqBtn.textContent = '▶ LOOP';
        playSeqBtn.classList.remove('pressed');
        if (seqSt) seqSt.textContent = 'STOPPED';
        clearInterval(seqInterval);
        stepPads.forEach(p => p.classList.remove('current'));
      }
    });

    document.getElementById('clearSeqBtn').addEventListener('click', () => {
      audio.playSwitchClick(800);
      for (let i = 0; i < 8; i++) {
        seqPattern[i] = 0;
        stepPads[i].dataset.mode = '0';
        stepPads[i].textContent = stepLabels[0];
      }
    });

    switchArchiveItem('ramune');

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /**
     * 8. メインアニメーションループ
     */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      state.pulseBump *= 0.82;
      worldStage.position.y = 0.25 + Math.sin(time * 1.2) * 0.03 + state.pulseBump;

      if (state.currentItem === 'ramune') {
        state.lidSlide += (state.targetLidSlide - state.lidSlide) * 0.18;
        rLidGroup.position.x = state.lidSlide;
        const st = document.getElementById('statusVal');
        if (st && !state.isTilting) st.textContent = state.lidSlide > 0.33 ? 'CAP OPEN' : 'CAP LOCKED';

        const targetTilt = state.isTilting ? 2.1 : 0;
        state.tiltZ += (targetTilt - state.tiltZ) * 0.08;
        ramuneGroup.rotation.z = state.tiltZ;

        if (audio.activeVoices.size > 0 && Math.random() < 0.25) spawnSoundRing();
        for (let i = waveRings.length - 1; i >= 0; i--) {
          const w = waveRings[i];
          w.life += 0.035;
          w.mesh.position.x += 0.035;
          const s = 1 + w.life * 2.8;
          w.mesh.scale.set(1, s, s);
          w.mesh.material.opacity = Math.max(0, 0.9 * (1 - w.life));
          if (w.life >= 1) { ramuneGroup.remove(w.mesh); waveRings.splice(i, 1); }
        }

        const g = 0.0022;
        const gx = Math.sin(state.tiltZ) * g;
        const gy = -Math.cos(state.tiltZ) * g;
        const halfW = RW / 2 - 0.10, halfH = RH / 2 - 0.12;
        const holeMaxX = -halfW + Math.min(0.55, state.lidSlide);

        for (let i = rTablets.length - 1; i >= 0; i--) {
          const t = rTablets[i];
          t.vx = (t.vx + gx) * 0.88;
          t.vy = (t.vy + gy) * 0.88;
          t.x += t.vx; t.y += t.vy;
          if (t.x - t.r < -halfW) { t.x = -halfW + t.r; t.vx *= -0.1; }
          if (t.x + t.r > halfW) { t.x = halfW - t.r; t.vx *= -0.1; }
          if (t.y - t.r < -halfH) { t.y = -halfH + t.r; t.vy *= -0.1; }
          if (t.y + t.r > halfH) {
            if (state.lidSlide > 0.33 && t.x < holeMaxX + 0.05) {
              const wp = new THREE.Vector3(t.x, t.y, t.z);
              ramuneGroup.localToWorld(wp);
              const dm = createPointTablet(0.17, 0.12);
              dm.position.copy(wp);
              scene.add(dm);
              rFalling.push({ mesh: dm, vx: -0.015, vy: -0.005 });
              ramuneGroup.remove(t.mesh);
              rTablets.splice(i, 1);
              audio.playTabletPerc();
              continue;
            } else {
              t.y = halfH - t.r; t.vy *= -0.1;
            }
          }
          t.mesh.position.set(t.x, t.y, t.z);
        }
        for (let i = rFalling.length - 1; i >= 0; i--) {
          const f = rFalling[i];
          f.vy -= 0.0022;
          f.mesh.position.x += f.vx; f.mesh.position.y += f.vy;
          f.mesh.material.opacity -= 0.012;
          if (f.mesh.material.opacity <= 0) { scene.remove(f.mesh); rFalling.splice(i, 1); }
        }
      }

      if (state.currentItem === 'sakuranbo') {
        jellyCells.forEach(c => {
          c.lift *= 0.85;
          c.mesh.position.z = c.basePos.z + c.lift;
          const sc = 1 + c.lift * 0.45;
          c.mesh.scale.set(sc, sc, 1);
        });

        if (state.tpReturnTimer > 0) {
          state.tpReturnTimer--;
        } else {
          state.tpTargetPos.copy(tpBasePos);
        }
        toothpickGroup.position.lerp(state.tpTargetPos, 0.18);
      }

      if (state.currentItem === 'yattermen') {
        const targetLidRot = state.yLidOpen ? -Math.PI * 0.68 : 0;
        state.yLidAngle += (targetLidRot - state.yLidAngle) * 0.16;
        yatterLidPivot.rotation.x = state.yLidAngle;

        if (state.yShakePower > 0.01) {
          yatterGroup.position.x = Math.sin(time * 55) * 0.09 * state.yShakePower;
          noodleGroup.position.y = Math.abs(Math.sin(time * 40)) * 0.12 * state.yShakePower;
          state.yShakePower *= 0.9;
        } else {
          yatterGroup.position.x = 0;
          noodleGroup.position.y = 0;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
